<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="afterTitle">
  <title id="afterTitle">Sample after photo: the same room painted a clean, flawless white</title>
  <defs>
    <linearGradient id="floorA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d2b48c"/>
      <stop offset="100%" stop-color="#b08958"/>
    </linearGradient>
    <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f2"/>
    </linearGradient>
    <linearGradient id="ceilA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f7f5"/>
    </linearGradient>
    <linearGradient id="softLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <polygon points="0,0 1200,0 1080,140 120,140" fill="url(#ceilA)"/>
  <rect x="120" y="140" width="960" height="520" fill="url(#wallA)"/>
  <polygon points="0,0 120,140 120,660 0,900" fill="#f0f0ee"/>
  <polygon points="1200,0 1080,140 1080,660 1200,900" fill="#e8e8e6"/>
  <polygon points="0,900 120,660 1080,660 1200,900" fill="url(#floorA)"/>
  <g opacity="0.14" stroke="#8a6a3e" stroke-width="3">
    <line x1="80" y1="880" x2="200" y2="668"/>
    <line x1="200" y1="880" x2="310" y2="668"/>
    <line x1="340" y1="880" x2="430" y2="668"/>
    <line x1="480" y1="880" x2="545" y2="668"/>
    <line x1="620" y1="880" x2="655" y2="668"/>
    <line x1="760" y1="880" x2="770" y2="668"/>
    <line x1="900" y1="880" x2="880" y2="668"/>
    <line x1="1040" y1="880" x2="990" y2="668"/>
    <line x1="1140" y1="880" x2="1060" y2="668"/>
  </g>

  <rect x="165" y="210" width="210" height="280" fill="#d9dde2"/>
  <rect x="178" y="224" width="184" height="252" fill="#eaf4fb"/>
  <line x1="270" y1="224" x2="270" y2="476" stroke="#d9dde2" stroke-width="8"/>
  <line x1="178" y1="350" x2="362" y2="350" stroke="#d9dde2" stroke-width="8"/>
  <rect x="155" y="490" width="230" height="18" fill="#f7f7f5"/>

  <!-- Clean white baseboards -->
  <path d="M120 640 h960 v28 H120 z" fill="#fafafa"/>
  <path d="M0 868 L120 668 v28 L0 900 z" fill="#f3f3f1"/>
  <path d="M1080 668 L1200 868 v32 L1080 696 z" fill="#ececec"/>
  <rect x="120" y="640" width="960" height="3" fill="#e6e6e4"/>

  <!-- Soft window light on the fresh paint -->
  <polygon points="390,224 720,224 640,476 390,476" fill="url(#softLight)"/>
  <rect x="120" y="140" width="960" height="8" fill="#ffffff" opacity="0.5"/>
</svg>
